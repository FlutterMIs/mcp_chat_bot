# Web app binds to this machine only. For phones/other devices set address = "0.0.0.0" (or run behind nginx/Caddy
# with https). The app has its own login (APP_AUTH_MODE=password|oidc); keep APP_AUTH_MODE=none only on a private machine.
[server]
address = "127.0.0.1"
port = 8501
headless = true
maxUploadSize = 50

[browser]
gatherUsageStats = false
